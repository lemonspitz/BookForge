# Builds the Mac, Windows and Linux apps and checks them without a screen or an e-reader.
# To release: push a version tag (v1.3, ...), or run the workflow by hand with that tag as `release`. It publishes
# a release with the three builds and the notes in .github/release-notes/<tag>.md.
name: Build Windows and Linux

on:
  push:
    branches: [build-*]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Version tag to release from this commit, e.g. v1.2 (leave empty to only build)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows-linux
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux libraries Qt needs off screen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libmtp9

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Windows Portable Devices bindings
        if: runner.os == 'Windows'
        run: python -c "import comtypes.client as c; c.GetModule('portabledeviceapi.dll'); c.GetModule('portabledevicetypes.dll'); import comtypes.gen.PortableDeviceApiLib, comtypes.gen.PortableDeviceTypesLib; print('ok')"

      - name: Windows Portable Devices check
        if: runner.os == 'Windows'
        run: python -c "import sys; sys.path.insert(0, '.'); from bookforge.readers import wpd; print('devices:', wpd.call(wpd._devices)); print('readers:', wpd.detect())"

      - name: Check from source
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: |
          [ "$RUNNER_OS" = Linux ] && export QT_QPA_PLATFORM=offscreen
          python run.py --device
          python tests/smoke.py ../screenshots-${{ matrix.platform }}
          python tests/kindle_check.py

      - name: Package
        run: pyinstaller --noconfirm --clean bookforge.spec

      - name: Check the package
        run: |
          if [ "$RUNNER_OS" = Windows ]; then "dist/Book Forge/Book Forge.exe" --device; sleep 5; else QT_QPA_PLATFORM=offscreen "dist/Book Forge/book-forge" --device; fi
          log="$(python -c 'import sys; sys.path.insert(0, "."); from bookforge.util import cache_dir; print(cache_dir())')/book-forge.log"
          if [ -f "$log" ]; then tail -20 "$log"; fi
          if [ -f "$log" ] && grep -q Traceback "$log"; then echo "::error::the packaged app logged an error"; exit 1; fi

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item windows/Install.cmd "dist/Book Forge/"
          Copy-Item windows/INSTALL.txt "dist/Book Forge/"
          Compress-Archive -Force -Path "dist/Book Forge" -DestinationPath "dist/Book-Forge-Windows.zip"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cp linux/install.sh linux/INSTALL.txt "dist/Book Forge/"
          chmod +x "dist/Book Forge/install.sh" "dist/Book Forge/book-forge"
          tar -C dist -czf dist/Book-Forge-Linux.tar.gz "Book Forge"

      - uses: actions/upload-artifact@v4
        with:
          name: Book-Forge-${{ matrix.platform }}
          path: windows-linux/dist/Book-Forge-${{ matrix.platform }}.*
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.platform }}
          path: screenshots-${{ matrix.platform }}
          retention-days: 7

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 (the app targets macOS 26)
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xc" ] || { echo "::error::no Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xc"
          swiftc --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # GitHub's Macs run an older macOS than the app needs, so a helper built from the app's own
      # KindleFormat.swift and AppIcon.swift draws the icon and runs the Kindle checks
      - name: Helper for this macOS
        run: |
          mkdir -p build-tool
          swiftc -O -swift-version 5 -target arm64-apple-macos15.0 Sources/KindleFormat.swift Sources/AppIcon.swift \
            windows-linux/tests/mac/Shell.swift windows-linux/tests/mac/main.swift -o build-tool/bookforge-tool

      - name: Build
        run: BOOKFORGE_ICON_TOOL=build-tool/bookforge-tool ./build.sh

      - name: Check Kindle conversion (and against the Windows/Linux converters)
        run: |
          pip install lxml pillow
          python windows-linux/tests/kindle_check.py build-tool/bookforge-tool

      - name: Zip
        run: ditto -c -k --keepParent "build/Book Forge.app" build/Book-Forge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Book-Forge-Mac
          path: build/Book-Forge.zip
          retention-days: 7

  release:
    needs: [build, mac]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Book-Forge-*
          path: assets
          merge-multiple: true

      - name: The Mac app
        run: ls assets/Book-Forge.zip

      - name: Publish
        run: |
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          ls -l assets
          gh release create "$TAG" assets/* --title "Book Forge ${TAG#v}" --notes-file "$notes" --target "$GITHUB_SHA"
